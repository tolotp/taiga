name: Build Taiga for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4
        with:
          ref: develop
          submodules: recursive
          fetch-depth: 0

      - name: Preparar MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalar Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

          python -m aqt install-qt `
            windows desktop 6.10.3 `
            win64_msvc2022_64 `
            -m qtimageformats `
            --outputdir C:\Qt

      - name: Establecer QTDIR
        shell: pwsh
        run: |
          $qt = "C:\Qt\6.10.3\msvc2022_64"

          if (!(Test-Path "$qt\bin\windeployqt.exe")) {
            Write-Error "No se encontró Qt en $qt"
          }

          "QTDIR=$qt" >> $env:GITHUB_ENV

      - name: Comprobar versiones
        shell: pwsh
        run: |
          cmake --version
          git --version
          where.exe cl
          cl

          Write-Host "QTDIR=$env:QTDIR"

      - name: Configurar
        shell: pwsh
        run: |
          cmake -B build/msvc-x64 `
            -DCMAKE_BUILD_TYPE=msvc-x64-release `
            -DCMAKE_PREFIX_PATH="$env:QTDIR"

      - name: Compilar
        shell: pwsh
        run: |
          cmake --build build/msvc-x64 `
            --config RelWithDebInfo `
            --target taiga

      - name: Desplegar
        shell: pwsh
        run: |
          & "$env:QTDIR\bin\windeployqt.exe" `
            --release `
            "bin\RelWithDebInfo\Taiga.exe"

      - name: Comprobar archivos generados
        shell: pwsh
        run: |
          if (!(Test-Path "bin\RelWithDebInfo\Taiga.exe")) {
            Write-Error "No se encontró Taiga.exe"
          }

          Get-ChildItem "bin\RelWithDebInfo" -Recurse

      - name: Crear ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "bin\RelWithDebInfo\*" `
            -DestinationPath "Taiga-windows-x64.zip" `
            -Force

      - name: Subir ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Taiga-windows-x64
          path: Taiga-windows-x64.zip
          if-no-files-found: error
