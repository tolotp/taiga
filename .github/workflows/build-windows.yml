name: Build Taiga for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4
        with:
          ref: develop
          submodules: recursive

      - name: Preparar MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalar Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

          python -m aqt install-qt `
            windows desktop 6.10.3 `
            win64_msvc2022_64 `
            -m qtimageformats `
            --outputdir C:\Qt

      - name: Encontrar Qt
        shell: pwsh
        run: |
          $config = Get-ChildItem `
            -Path "C:\Qt" `
            -Filter "Qt6Config.cmake" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $config) {
            Write-Error "No se encontró Qt6Config.cmake dentro de C:\Qt"
          }

          $qtDir = $config.Directory.Parent.Parent.Parent.FullName

          Write-Host "Qt encontrado en: $qtDir"
          Write-Host "Qt6Config.cmake: $($config.FullName)"

          "QTDIR=$qtDir" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtDir" >> $env:GITHUB_ENV

      - name: Comprobar herramientas y Qt
        shell: pwsh
        run: |
          cmake --version
          git --version
          where.exe cl

          if (!(Test-Path "$env:QTDIR/bin/windeployqt.exe")) {
            Write-Error "No se encontró windeployqt.exe"
          }

          if (!(Test-Path "$env:QTDIR/lib/cmake/Qt6/Qt6Config.cmake")) {
            Write-Error "No se encontró Qt6Config.cmake"
          }

      - name: Configurar
        shell: pwsh
        run: |
          cmake -B build/msvc-x64 `
            -DCMAKE_BUILD_TYPE=msvc-x64-release `
            -DCMAKE_PREFIX_PATH="$env:QTDIR"

      - name: Compilar
        shell: pwsh
        run: |
          cmake --build build/msvc-x64 `
            --config RelWithDebInfo `
            --target taiga

      - name: Desplegar Qt
        shell: pwsh
        run: |
          & "$env:QTDIR/bin/windeployqt.exe" `
            --release `
            "bin/RelWithDebInfo/Taiga.exe"

      - name: Comprobar ejecutable
        shell: pwsh
        run: |
          if (!(Test-Path "bin/RelWithDebInfo/Taiga.exe")) {
            Write-Error "No se encontró bin/RelWithDebInfo/Taiga.exe"
          }

      - name: Crear ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "bin/RelWithDebInfo/*" `
            -DestinationPath "Taiga-windows-x64.zip" `
            -Force

      - name: Subir compilación
        uses: actions/upload-artifact@v4
        with:
          name: Taiga-windows-x64
          path: Taiga-windows-x64.zip
          if-no-files-found: error
