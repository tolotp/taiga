name: Build Taiga for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Taiga
        uses: actions/checkout@v4
        with:
          ref: develop
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

          python -m aqt install-qt `
            windows desktop 6.10.3 `
            win64_msvc2022_64 `
            -m qtimageformats

      - name: Check required tools
        shell: pwsh
        run: |
          cmake --version
          git --version
          cl
          Test-Path "C:\Qt\6.10.3\msvc2022_64\bin\windeployqt.exe"

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -B build/msvc-x64 `
            -DCMAKE_BUILD_TYPE=msvc-x64-release `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.10.3\msvc2022_64"

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build build/msvc-x64 `
            --config RelWithDebInfo `
            --target taiga

      - name: Deploy Qt dependencies
        shell: pwsh
        run: |
          $qt = "C:\Qt\6.10.3\msvc2022_64"
          $exe = "bin\RelWithDebInfo\Taiga.exe"

          if (!(Test-Path $exe)) {
            Write-Error "No se encontró $exe"
          }

          & "$qt\bin\windeployqt.exe" `
            --release `
            "$exe"

      - name: Verify output
        shell: pwsh
        run: |
          $exe = "bin\RelWithDebInfo\Taiga.exe"

          if (!(Test-Path $exe)) {
            Write-Error "Falta Taiga.exe"
          }

          if (!(Test-Path "bin\RelWithDebInfo\platforms\qwindows.dll")) {
            Write-Error "Falta platforms\qwindows.dll"
          }

          if (!(Test-Path "bin\RelWithDebInfo\sqldrivers\qsqlite.dll")) {
            Write-Error "Falta sqldrivers\qsqlite.dll"
          }

          Get-ChildItem "bin\RelWithDebInfo" -Recurse

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "bin\RelWithDebInfo\*" `
            -DestinationPath "Taiga-windows-x64.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taiga-windows-x64
          path: Taiga-windows-x64.zip
          if-no-files-found: error
